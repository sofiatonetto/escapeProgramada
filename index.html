<style>
/* Layout: one narrow "document" column on lilac paper. Team view = timer bar, syllable strip, six enigma cards + the vault. Guardiã view = live scoreboard. Single deliberate look matching the ProgramADA print pieces. */
:root{
  --paper:#DCD0E2; --sheet:#EFE7F3; --white:#FFFFFF; --ink:#2B1452; --plum:#3D1A6E; --violet:#5A2A9C; --muted:#7D6A9C; --ember:#E2572B; --ok:#2F7A4F; --okbg:#E3F1E8; --line:#B9A3DE; --lock:#CDBBDD;
  --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);margin:0;min-height:100vh;background-image:radial-gradient(#5A2A9C0f 1px,transparent 1.2px);background-size:22px 22px}
.wrap{max-width:600px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{text-align:center;display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.3em;color:var(--violet);font-weight:700}
h1{font-weight:700;font-size:clamp(22px,6vw,30px);line-height:1.15;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--ember)}
.story{font-family:var(--serif);font-size:20px;line-height:1.45;font-style:italic;color:var(--plum);margin:0}
p{margin:0;line-height:1.6;font-size:15px}
label{font-size:12px;letter-spacing:.18em;font-weight:700;color:var(--violet)}
.card{background:var(--sheet);border:2px solid var(--plum);border-radius:10px;box-shadow:6px 6px 0 var(--plum);overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:2px solid var(--plum);background:#CDBBDD;font-size:13px;color:var(--plum)}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--plum);flex:none}
.bar .t{margin-left:6px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input.txt{flex:1 1 200px;min-width:0;font:700 18px var(--mono);padding:12px 14px;border:2px solid var(--plum);border-radius:8px;background:var(--white);color:var(--ink)}
button{font:700 15px var(--mono);letter-spacing:.06em;padding:12px 18px;border-radius:8px;border:2px solid var(--plum);background:var(--plum);color:#fff;cursor:pointer}
button:hover{background:var(--violet)}
button.ghost{background:transparent;color:var(--plum)}
button.small{font-size:12px;padding:7px 10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.msg{font-size:14px;min-height:1.3em}
.msg.no{color:var(--ember)}
.status{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;background:var(--plum);color:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 4px 0 #2B145233}
.status .team{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status .clock{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:#FFD9C9}
.status .clock.low{color:#FF9B7A}
.status .left{font-size:12px;text-align:right;line-height:1.3;color:#E7DCF5}
.slots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.slot{min-height:36px;padding:2px;text-align:center;border:2px solid var(--plum);border-radius:6px;background:var(--sheet);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--line);letter-spacing:0;white-space:nowrap}
.slot.got{color:var(--ink);background:var(--white);box-shadow:3px 3px 0 var(--plum)}
.enig{border:2px solid var(--plum);border-radius:10px;background:var(--sheet);padding:14px;display:flex;flex-direction:column;gap:10px}
.enig.locked{border-style:dashed;border-color:var(--line);background:transparent;color:var(--muted)}
.enig.done{background:var(--white)}
.enig .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.enig .name{font-weight:700;font-size:16px}
.enig .lvl{font-size:11px;letter-spacing:.14em;color:var(--violet)}
.enig.locked .lvl{color:var(--line)}
.badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--okbg);color:var(--ok)}
.next{border-left:4px solid var(--ember);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:4px}
.next .story{font-size:18px}
.boxes{--n:6;--cw:1.7ch;font:700 22px var(--mono);width:calc(var(--n) * var(--cw) - 4px);max-width:100%;padding:8px 0 8px calc((var(--cw) - 1ch) / 2);letter-spacing:calc(var(--cw) - 1ch);border:0;border-radius:0;text-transform:uppercase;color:var(--ink);
  background:repeating-linear-gradient(90deg,var(--white) 0 calc(var(--cw) - 4px),transparent calc(var(--cw) - 4px) var(--cw));box-shadow:inset 0 -3px 0 var(--plum)}
.boxes:disabled{background:repeating-linear-gradient(90deg,var(--lock) 0 calc(var(--cw) - 4px),transparent calc(var(--cw) - 4px) var(--cw));box-shadow:none;color:var(--muted)}
.words{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.count{font-size:11px;color:var(--muted);letter-spacing:.08em}
.hint{font-family:var(--serif);font-size:21px;line-height:1.35;color:var(--plum);text-align:center;margin:0}
.big{font-size:40px;font-weight:700;color:var(--ember);font-variant-numeric:tabular-nums;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.14em;text-align:left;color:var(--violet);padding:8px 6px;border-bottom:2px solid var(--plum);white-space:nowrap}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
td.pos{font-weight:700;color:var(--ember);width:28px}
.pips{display:flex;gap:3px}
.pip{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--plum)}
.pip.on{background:var(--violet)}
.pip.vault{border-radius:50%}
.pip.vault.on{background:var(--ember);border-color:var(--ember)}
.st{font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;white-space:nowrap}
.st.run{background:#E7DCF5;color:var(--violet)}
.st.win{background:var(--okbg);color:var(--ok)}
.st.out{background:#FBE3DA;color:#A23A16}
.tablewrap{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--white);border:2px solid var(--plum);border-radius:8px;padding:10px;text-align:center}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;letter-spacing:.1em;color:var(--muted)}
footer{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-align:center}
footer .row{justify-content:center}
footer input.txt{flex:0 1 170px;font-size:13px;padding:8px 10px}
.note{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.slot.got{animation:pop .45s ease}@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}}
.reveal{border:2px dashed var(--plum);border-radius:8px;padding:14px;display:flex;gap:14px;align-items:center;background:var(--white)}
.reveal p{font-size:14px}
select.txt{appearance:auto}
#who input.txt,#who select.txt{flex:none;width:100%}
.reveal{flex-direction:column;align-items:flex-start;gap:6px}
.reveal .big{text-align:left;white-space:nowrap}
</style>

async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

{const q=new URLSearchParams(location.search);

function push(){

const solvedCount=()=>order().filter(k=>S.solved[k]).length;
const sylls=()=>{const m=new Map();order().forEach(k=>{const i=S.info[k];if(i&&Array.isArray(i.l))i.l.forEach(([id,t])=>m.set(id,t))});return [...m.values()]};
/* pares de enigmas de dificuldade parecida: cada equipe faz um de cada par */
const PAIRS=[[9,8],[7,10],[1,5],[3,4],[2,6]];
const rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
function makePath(){const st=PAIRS.map(p=>p[rnd(2)]);for(let i=st.length-1;i>0;i--){const j=rnd(i+1);[st[i],st[j]]=[st[j],st[i]]}return [0,...st]}

      <form id="f" class="row">${boxes(e.len,`aria-label="Resposta, ${e.len} letras"`)}<button>Verificar</button></form>

    </div></section>`;
  }
  $("app").innerHTML=html;
  if($("next"))$("next").onclick=()=>{S.showing=null;save();render()};
  const f=$("f");
  if(f){const inp=f.querySelector("input");inp.oninput=()=>{$("msg").textContent=""};
    f.onsubmit=async ev=>{ev.preventDefault();if(timeLeft()<=0){render();return}
      const w=norm(inp.value), m=$("msg");if(cur===undefined){render();return}
      if(!w){m.className="msg no";m.textContent="Digitem a resposta primeiro.";return}
      if(await sha("ada:"+w)===STX[cur].h){const o=await dec(STX[cur].d,w);S.solved[cur]=Date.now();S.info[cur]={l:o.l,w};S.showing=cur;save();push();render()}
      else{m.className="msg no";m.textContent="Ainda não. Tentem de novo."}

/* ---------- guardiã ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.id==="pinBtn"){if($("pin").value.trim()===PIN){S.mode="guard";history.replaceState(null,"","#guardia");save();subscribeAll();render()}else $("pinMsg").textContent="Senha incorreta."}
  if(t.id==="leaveGuard"){S.mode="team";save();render()}
  if(t.id==="resetBtn"){if(norm($("resetIn").value)==="REINICIAR"){if(unsubMe){unsubMe();unsubMe=null}S=blank();save();render()}else $("resetIn").focus()}
  if(t.dataset&&t.dataset.del){if(t.dataset.armed){const id=t.dataset.del;if(id.startsWith("r:")){G.results=G.results.filter(r=>r.id!==id.slice(2));gsave();renderGuardBoard()}else db&&db.collection("teams").doc(id).delete().catch(()=>{})}else{t.dataset.armed="1";t.textContent="Confirmar"}}
});
const teamTime=t=>(t.end||Date.now())-t.start;
function renderGuard(){
  $("app").innerHTML=`<section class="card">${bar("cofre.lock")}<div class="body">
      <label>O COFRE</label>
      <p class="hint">Ada escreveu o primeiro programa da história para ela. O que era, e quem a inventou?</p>
      <form id="vault" style="display:flex;flex-direction:column;gap:12px">
        <div id="who"></div>
        <div class="words">${FINAL_WORDS.map((n,k)=>boxes(n,`data-w="${k}" aria-label="Palavra ${k+1}, ${n} letras"`)).join("")}</div>
        <div class="count">5 palavras · 7, 9, 2, 7 e 7 letras</div>
        <div class="row"><button>Abrir o cofre</button></div>
        <div class="msg" id="vmsg"></div>
      </form></div></section>
    <section class="card">${bar("placar")}<div class="body" id="board"></div></section>`;
  renderWho(); renderGuardBoard();
  const ins=[...document.querySelectorAll("#vault [data-w]")];
  ins.forEach((inp,k)=>{inp.oninput=()=>{$("vmsg").textContent="";if(inp.value.length>=inp.maxLength&&ins[k+1])ins[k+1].focus()}});
  $("vault").onsubmit=async ev=>{ev.preventDefault();const m=$("vmsg");m.className="msg no";
    const w=norm(ins.map(x=>x.value).join(""));
    const live=db&&teams.some(t=>t.start&&!t.end);
    let team=null,name="",ms=null;
    if(live){team=teams.find(t=>t.id===$("teamSel").value);if(!team){m.textContent="Escolham a equipe primeiro.";return}}
    else{name=$("vName").value.trim()||`Equipe ${G.results.length+1}`;}
    if(!w){m.textContent="Preencham as palavras primeiro.";return}
    if(await sha("ada:"+w)!==FINAL){m.textContent="O cofre continua trancado. Testem outra combinação.";return}
    if(team){const end=Date.now();await db.collection("teams").doc(team.id).update({end}).catch(()=>{});m.className="msg";m.textContent=`Cofre aberto! ${team.name}: ${fmt(end-team.start)}.`}
    else{const at=Date.now();G.results.push({id:at.toString(36),name,at});gsave();m.className="msg";m.textContent=`Cofre aberto! ${name}, às ${clock(at)}.`;renderGuardBoard()}
    ins.forEach(x=>x.value="");renderWho();
  };
  foot(`<button class="ghost small" id="leaveGuard">Sair do painel</button>`);
}
function renderWho(){
  const who=$("who");if(!who)return;
  const open=db?teams.filter(t=>t.start&&!t.end):[];
  if(open.length){who.innerHTML=`<label for="teamSel">EQUIPE</label><select id="teamSel" class="txt">${open.map(t=>`<option value="${t.id}">${esc(t.name)} · ${(t.solved||[]).filter(Boolean).length}/${N}</option>`).join("")}</select>`}
  else{who.innerHTML=`<div style="display:flex;flex-direction:column;gap:6px"><label for="vName">EQUIPE</label><input class="txt" id="vName" maxlength="24" placeholder="Nome ou cor da equipe (opcional)"></div>`}
}
function renderGuardBoard(){
  const b=$("board");if(!b)return;
  const wantSel=!!(db&&teams.some(t=>t.start&&!t.end)), sel=$("teamSel");
  if(wantSel!==!!sel)renderWho();
  else if(sel){const v=sel.value;renderWho();const s2=$("teamSel");if(s2&&[...s2.options].some(o=>o.value===v))s2.value=v}
  let rows;
  if(db&&teams.length){
    rows=teams.filter(t=>t.start).map(t=>{const n=(t.solved||[]).filter(Boolean).length,out=!t.end&&teamTime(t)>=LIMIT;return{id:t.id,name:t.name,n,end:!!t.end,out,time:t.end?t.end-t.start:null,t}});
  }else{
    rows=G.results.map(r=>({id:"r:"+r.id,name:r.name,n:N,end:true,out:false,time:r.at,at:r.at}));
  }
  rows.sort((a,b)=>(a.end?0:a.out?2:1)-(b.end?0:b.out?2:1)||(a.end?a.time-b.time:b.n-a.n));
  const fin=rows.filter(r=>r.end).length, run=rows.filter(r=>!r.end&&!r.out).length;
  let html=`<div class="kpis"><div class="kpi"><b>${rows.length}</b><span>EQUIPES</span></div><div class="kpi"><b>${run}</b><span>EM JOGO</span></div><div class="kpi"><b>${fin}</b><span>COFRE ABERTO</span></div></div>`;
  if(!rows.length)html+=`<p class="note">${db?'Nenhuma equipe começou ainda. Quando uma equipe tocar em "Iniciar", ela aparece aqui.':"Os resultados aparecem aqui conforme as equipes abrem o cofre."}</p>`;
  else html+=`<div class="tablewrap"><table><thead><tr><th>#</th><th>EQUIPE</th><th>ACERTOS</th><th>${db&&teams.length?"TEMPO":"COFRE ABERTO"}</th><th>SITUAÇÃO</th><th></th></tr></thead><tbody>${rows.map((r,k)=>`<tr>
    <td class="pos">${k+1}</td><td><b>${esc(r.name||"Sem nome")}</b></td>
    <td><div class="pips">${Array.from({length:N},(_,j)=>`<span class="pip ${j<r.n?"on":""}"></span>`).join("")}<span class="pip vault ${r.end?"on":""}"></span></div><span class="count">${r.n}/${N}${r.end?" + cofre":""}</span></td>
    <td ${r.t&&!r.end?`data-tt="${r.id}"`:""}>${r.at?"às "+clock(r.at):r.end?fmt(r.time):fmt(Math.min(teamTime(r.t),LIMIT))}</td>
    <td>${r.end?`<span class="st win">Cofre aberto</span>`:r.out?`<span class="st out">Tempo esgotado</span>`:`<span class="st run">${r.n===N?"Indo ao cofre":"Na etapa "+(r.n+1)}</span>`}</td>
    <td><button class="ghost small" data-del="${r.id}">Remover</button></td></tr>`).join("")}</tbody></table></div>
    <p class="note">${db&&teams.length?"Ordem: primeiro quem abriu o cofre, pelo menor tempo; depois quem ainda joga, por número de acertos.":"Ordem: quem abriu o cofre primeiro."}</p>`;
  b.innerHTML=html;
}

/* ---------- clocks: display only ---------- */
setInterval(()=>{
  if(S.mode==="guard"){teams.forEach(t=>{const a=document.querySelector(`[data-tt="${t.id}"]`);if(a&&t.start)a.textContent=fmt(Math.min(teamTime(t),LIMIT))});return}
  if(!S.start||S.end)return;
  const c=$("clock");if(!c)return;const tl=timeLeft();c.textContent=fmt(tl);c.classList.toggle("low",tl<5*60*1000);
  if(tl<=0&&$("f"))render();
},500);
render();
</script>
